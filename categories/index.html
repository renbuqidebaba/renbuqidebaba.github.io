    <!-- 不蒜子只在「远端计数请求成功」时才显示：请求失败（被网络拦截/后端挂了）时，
         容器保持 display:none，避免出现「总访问量：」后面空着的坏样式。
         成功由 busuanzi 自身的 shows() 置为 inline；这里在拿到数值后还原成 CSS 默认显示，
         并兜底：6 秒内仍拿不到数值就维持隐藏。 -->
    <script>
        (function () {
            var ids = ['busuanzi_container_site_pv', 'busuanzi_container_site_uv', 'busuanzi_container_page_pv'];
            var deadline = Date.now() + 6000;
            function tick() {
                var pending = false;
                for (var i = 0; i < ids.length; i++) {
                    var box = document.getElementById(ids[i]);
                    if (!box) continue;
                    var val = box.querySelector('[id^="busuanzi_value"]');
                    var filled = val && val.textContent.trim() !== '';
                    if (filled) {
                        box.style.display = '';          /* 还原 CSS 默认（span=行内, div=块级） */
                    } else if (Date.now() < deadline) {
                        pending = true;                  /* 还没拿到，继续等 */
                    } else {
                        box.style.display = 'none';      /* 超时仍未拿到，隐藏，避免空标签 */
                    }
                }
                if (pending) setTimeout(tick, 400);
            }
            tick();
        })();
    </script>

<div id="searchModal" class="modal">
    <div class="modal-content">
        <div class="search-header">
            <span class="title"><i class="fas fa-search"></i>&nbsp;&nbsp;搜索</span>
            <input type="search" id="searchInput" name="s" placeholder="请输入搜索的关键字"
                   class="search-input">
        </div>
        <div id="searchResult"></div>
    </div>
</div>

<script type="text/javascript">
$(function () {
    var datas = null;          // 已加载的索引
    var pendingValue = null;   // 索引还没回来时用户已经敲进去的字
    var searchPath = '/search.xml';
    var searchInputId = 'searchInput';
    var searchResultId = 'searchResult';

    var render = function (value) {
        var $resultContent = document.getElementById(searchResultId);
        if (!datas) { pendingValue = value; return; }   // 索引未就绪，先记下来
        var text = (value || '').trim();
        $resultContent.innerHTML = "";
        if (text.length <= 0) {
            return;
        }
        var keywords = text.toLowerCase().split(/[\s\-]+/);
        var str = '<ul class=\"search-result-list\">';
        var cnt = 0;
        // perform local searching
        datas.forEach(function (data) {
            var isMatch = true;
            var data_title = data.title.trim().toLowerCase();
            var data_content = data.content.trim().replace(/<[^>]+>/g, "").toLowerCase();
            var data_url = data.url;
            data_url = data_url.indexOf('/') === 0 ? data.url : '/' + data_url;
            var index_title = -1;
            var index_content = -1;
            var first_occur = -1;
            // only match artiles with not empty titles and contents
            if (data_title !== '' && data_content !== '') {
                keywords.forEach(function (keyword, i) {
                    index_title = data_title.indexOf(keyword);
                    index_content = data_content.indexOf(keyword);
                    if (index_title < 0 && index_content < 0) {
                        isMatch = false;
                    } else {
                        if (index_content < 0) {
                            index_content = 0;
                        }
                        if (i === 0) {
                            first_occur = index_content;
                        }
                    }
                });
            }
            // show search results
            if (isMatch) {
                str += "<li><a href='" + data_url + "' class='search-result-title'>" + data_title + "</a>";
                var content = data.content.trim().replace(/<[^>]+>/g, "");
                if (first_occur >= 0) {
                    // cut out 100 characters
                    var start = first_occur - 20;
                    var end = first_occur + 80;
                    if (start < 0) {
                        start = 0;
                    }
                    if (start === 0) {
                        end = 100;
                    }
                    if (end > content.length) {
                        end = content.length;
                    }
                    var match_content = content.slice(start, end);
                    // highlight all keywords
                    keywords.forEach(function (keyword) {
                        // C++、括号等按普通搜索词匹配，避免被当成正则语法。
                        var regS = new RegExp(keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), "gi");
                        match_content = match_content.replace(regS, "<em class=\"search-keyword\">" + keyword + "</em>");
                    });

                    str += "<p class=\"search-result\">" + match_content + "...</p>"
                }
                str += "</li>";
                cnt += 1;
            }
        });
        str += "</ul>";
        str = "<p class=\"search-result-summary\">共找到" + String(cnt) + "条结果</p>" + str;
        $resultContent.innerHTML = str;
    };

    var searchFunc = function (path, search_id, content_id) {
        'use strict';
        $.ajax({
            url: path,
            dataType: "xml",
            success: function (xmlResponse) {
                // get the contents from search data
                datas = $("entry", xmlResponse).map(function () {
                    return {
                        title: $("title", this).text(),
                        content: $("content", this).text(),
                        url: $("url", this).text()
                    };
                }).get();
                // 拉索引期间用户可能已经敲了字，补跑一次，不丢词
                if (pendingValue) {
                    var v = pendingValue;
                    pendingValue = null;
                    render(v);
                }
            }
        });
        document.getElementById(search_id).addEventListener('input', function () {
            render(this.value);
        });
    };

    /* 原来一进页面就 $.ajax 把 search.xml 全量拉下来（改 striptags 后仍有约 300KB），
       它跟首屏渲染毫无关系，却每次访问都在抢带宽。
       改成：第一次打开搜索弹窗时才拉。 */
    var started = false;
    var start = function () {
        if (started) return;
        started = true;
        searchFunc(searchPath, searchInputId, searchResultId);
    };
    var modal = document.getElementById('searchModal');
    if (modal) {
        // materialize 打开弹窗时会给 #searchModal 加 class="open"
        var observer = new MutationObserver(function () {
            if (modal.classList.contains('open')) {
                start();
                observer.disconnect();
            }
        });
        observer.observe(modal, { attributes: true, attributeFilter: ['class', 'style'] });
    }
    // 兜底：直接监听触发弹窗的那几个元素（导航栏的放大镜 + 移动端的搜索入口）
    $(document).on('click', 'a[href="#searchModal"], #searchIcon, .modal-trigger[href="#searchModal"]', start);
    // 再兜一层：焦点进到搜索框说明弹窗已经开了
    var inputEl = document.getElementById(searchInputId);
    if (inputEl) inputEl.addEventListener('focus', start);
});
</script>

<script>
    function switchNightMode() {
        // 两个比较方案直接切换，沿用持久化设置，避免全屏动画打断阅读。
        if (document.body.classList.contains('journal-home') || document.body.classList.contains('matery-foundation')) {
            var dark = document.body.classList.toggle('DarkMode');
            localStorage.setItem('isDark', dark ? '1' : '0');
            var icon = document.getElementById('sum-moon-icon');
            if (icon) {
                icon.classList.toggle('fa-sun', dark);
                icon.classList.toggle('fa-moon', !dark);
            }
            return;
        }
        $('<div class="Cuteen_DarkSky"><div class="Cuteen_DarkPlanet"></div></div>').appendTo($('body')),
        setTimeout(function () {
            $('body').hasClass('DarkMode') 
            ? ($('body').removeClass('DarkMode'), localStorage.setItem('isDark', '0'), $('#sum-moon-icon').removeClass("fa-sun").addClass('fa-moon')) 
            : ($('body').addClass('DarkMode'), localStorage.setItem('isDark', '1'), $('#sum-moon-icon').addClass("fa-sun").removeClass('fa-moon')),
            
            setTimeout(function () {
            $('.Cuteen_DarkSky').fadeOut(1e3, function () {
                $(this).remove()
            })
            }, 2e3)
        })
    }
</script>
